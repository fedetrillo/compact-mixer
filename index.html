<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compact Mixer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141416; --panel: #1c1c20; --raised: #25252a; --line: #2e2e35; --text: #e6e6ea; --dim: #8a8a94;
      --accent: #f2c14e; --mute: #c44545; --solo: #d8b52a; --sel: #5b8def;
      --w: 50px;
    }
    body.tiny { --w: 36px; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 12px/1.25 -apple-system, system-ui, Helvetica, sans-serif; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
    button, input { font: inherit; color: inherit; }

    /* Toolbar */
    header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
    .btn { background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: #444; }
    .btn[disabled] { opacity: .35; cursor: default; }
    .btn.on { background: var(--accent); border-color: var(--accent); color: #111; }
    #play.on { background: #2f9e57; border-color: #2f9e57; color: #fff; }
    #search { width: 130px; min-width: 70px; flex: 0 1 130px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; outline: none; user-select: text; }
    #search:focus { border-color: var(--accent); }
    .group { display: flex; gap: 3px; align-items: center; }
    .chip { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 2px 8px; cursor: pointer; color: var(--dim); }
    .chip.on { background: var(--raised); color: var(--text); border-color: #4a4a52; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
    .dot.on { border-color: #fff; }
    #clearSolo.active { background: var(--solo); border-color: var(--solo); color: #111; }
    #unmute.active { background: var(--mute); border-color: var(--mute); color: #fff; }
    #count { color: var(--dim); font-variant-numeric: tabular-nums; }
    #status { color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
    #status.error { color: #ff8080; }
    .spacer { flex: 1; }

    /* Strips */
    #body { flex: 1; display: flex; min-height: 0; }
    #strips { flex: 1; display: flex; gap: 2px; padding: 6px; overflow-x: auto; overflow-y: hidden; min-width: 0; }
    #masterBox { flex: none; display: flex; padding: 6px; border-left: 1px solid var(--line); background: var(--panel); }
    #empty { color: var(--dim); padding: 20px; }
    .strip { width: var(--w); flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 2px 4px; background: var(--panel); border-radius: 4px; border: 1px solid transparent; overflow: hidden; }
    .strip.selected { border-color: var(--sel); }
    .strip .color { align-self: stretch; height: 4px; margin: 0 -2px; background: #555; }
    .strip .head { position: relative; width: 100%; height: 26px; flex: none; }
    .strip .name { width: 100%; height: 100%; font-size: 10px; text-align: center; overflow: hidden; word-break: break-word; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .strip .name:hover { color: #fff; }
    .strip .pan { width: 100%; height: 14px; margin: 0; accent-color: #9ab; }
    .strip .pans { display: flex; gap: 1px; width: 100%; }
    .strip .pans .pan { flex: 1; min-width: 0; }
    .strip .panlabel { font-size: 9px; color: var(--dim); height: 1.1em; white-space: nowrap; overflow: hidden; }
    .strip .peak { font-size: 10px; font-variant-numeric: tabular-nums; height: 1.25em; width: 100%; text-align: center; border-radius: 2px; color: var(--dim); background: #0c0c0e; cursor: pointer; }
    .strip .peak.hot { color: #fff; background: #b23030; }

    /* The fader lane is the meter. Only a thin line marks the fader's position; the bars,
       the peak lines and the dB marks stay visible above and below it. */
    .lane { flex: 1; min-height: 60px; position: relative; align-self: stretch; margin: 0 4px; background: #0b0b0d; border-radius: 2px; cursor: ns-resize; touch-action: none; outline: none; }
    .lane .bars { position: absolute; inset: 0; display: flex; gap: 1px; padding: 0 1px; overflow: hidden; border-radius: 2px; }
    .lane .stream { position: relative; flex: 1; overflow: hidden; background: #17171b; }
    /* Bars and peak lines move by transform only, never height (docs/DRAWING.md): <i> slides
       down by the unlit share, its <u> back up by the same so the colours stay put, and <b>
       carries the held-peak line on its top edge. */
    .lane .stream i, .lane .stream u, .lane .stream b { position: absolute; inset: 0; transform: translateY(100%); will-change: transform; }
    .lane .stream i { overflow: hidden; }
    .lane .stream u { transform: translateY(-100%); }
    .lane .stream b::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(255,255,255,.85); }
    .lane.clip .bars { box-shadow: inset 0 0 0 1px #e04545; }
    .lane .ticks { position: absolute; inset: 0; pointer-events: none; }
    .lane .tick { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid rgba(255,255,255,.16); }
    .lane .tick.zero { border-top-color: rgba(255,255,255,.4); }
    .lane .tick span { position: absolute; right: calc(100% + 3px); top: -6px; font-size: 8px; line-height: 1; color: var(--dim); }
    .lane .cap { position: absolute; inset: 0; pointer-events: none; will-change: transform; }
    .lane .cap::before { content: ''; position: absolute; left: -4px; right: -4px; top: -1.5px; height: 3px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.75); border-radius: 1px; }
    .lane:hover .cap::before, .lane.dragging .cap::before { height: 4px; top: -2px; background: var(--accent); }
    .lane:focus-visible { box-shadow: 0 0 0 1px var(--accent); }
    .strip .db { font-size: 10px; cursor: default; font-variant-numeric: tabular-nums; height: 1.2em; color: var(--dim); }
    .strip .buttons { display: flex; gap: 2px; width: 100%; }
    .strip .buttons button { flex: 1; min-width: 0; padding: 2px 0; font-size: 10px; font-weight: 600; border-radius: 3px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; }
    .strip .mute.on { background: var(--mute); border-color: var(--mute); color: #fff; }
    .strip .solo.on { background: var(--solo); border-color: var(--solo); color: #111; }
    .strip.master { --w: 64px; }
    .strip.master .lane { margin-left: 22px; }
    body.tiny .strip:not(.master) .buttons { flex-direction: column; }
    body.tiny .strip .name { font-size: 9px; }


    /* Wide strip: the selected channel. Inserts, sends and pan on the left, the fader-meter on the right. */
    .strip.wide { --w: 196px; border-color: var(--sel); background: #202027; }
    body.tiny .strip.wide { --w: 180px; }
    .strip.wide .name { height: auto; -webkit-line-clamp: 1; font-size: 11px; font-weight: 600; }
    .strip .cols { flex: 1; min-height: 0; display: flex; gap: 4px; width: 100%; }
    .strip .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; overflow-x: hidden; padding-right: 1px; }
    .strip .fadercol { width: 46px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .strip .sec .h { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 2px; display: flex; justify-content: space-between; }
    .strip .sec .h .panlabel { text-transform: none; letter-spacing: 0; height: auto; }
    .strip .none { font-size: 10px; color: #5c5c66; padding: 2px 0; }
    .strip .ins { display: flex; gap: 2px; margin-bottom: 2px; }
    .strip .ins .pwr { flex: none; width: 14px; padding: 0; border-radius: 3px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; position: relative; }
    .strip .ins .pwr::after { content: ''; position: absolute; left: 4px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: #444; }
    .strip .ins .pwr.on::after { background: #4fd16a; box-shadow: 0 0 4px #4fd16a; }
    .strip .ins .pname { flex: 1; min-width: 0; text-align: left; font-size: 10px; padding: 2px 4px; border-radius: 3px; border: 1px solid var(--line); background: #2b2d36; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .strip .ins .pname:hover { border-color: #555; }
    .strip .ins .pname.open { border-color: var(--accent); color: var(--accent); }
    .strip .ins .pname.err { color: #ff8080; }
    .strip .ins.bypassed .pname { opacity: .45; text-decoration: line-through; }
    .strip .send { background: #18181c; border-radius: 3px; padding: 2px 3px; margin-bottom: 3px; }
    .strip .send .top { display: flex; justify-content: space-between; gap: 4px; font-size: 10px; }
    .strip .send .to { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .strip .send .sdb { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
    .strip .send .bot { display: flex; align-items: center; gap: 2px; }
    .strip .send input { flex: 1; min-width: 0; height: 12px; margin: 0; accent-color: #9ab; }
    .strip .send button { flex: none; width: 16px; padding: 0; font-size: 9px; font-weight: 600; border-radius: 2px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; }
    .strip .send .smute.on { background: var(--mute); border-color: var(--mute); color: #fff; }
    .strip .send .spre.on { background: #3d6fd1; border-color: #3d6fd1; color: #fff; }
    .strip .send.muted .top { opacity: .5; }
    .strip.wide .pans .pan { height: 16px; }
    .strip.wide .lane { margin: 0 4px; }
    body.tiny .strip.wide .buttons { flex-direction: row; }

    /* Pin: keeps a channel wide. Shown on hover, always when pinned. */
    .strip .pin { position: absolute; top: -3px; right: -1px; width: 14px; height: 14px; padding: 0; border: 0; border-radius: 3px; background: rgba(20,20,24,.85); color: var(--dim); cursor: pointer; display: none; align-items: center; justify-content: center; }
    .strip:hover .pin, .strip .pin.on { display: flex; }
    .strip .pin.on { color: var(--accent); }
    .strip .pin:hover { color: #fff; }
    .strip.wide .head { display: flex; align-items: center; gap: 4px; }
    .strip.wide .pin { position: static; display: flex; flex: none; }
    .strip.pinned { border-color: rgba(242,193,78,.6); }
    .strip.pinned.selected { border-color: var(--sel); }


    /* Plugin names open the plugin window. */
    .strip .ins .pname { display: flex; align-items: center; gap: 3px; }
    .strip .ins .pname .pt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .strip .ins .pname .open-ic { flex: none; font-size: 9px; color: var(--dim); }
    .strip .ins .pname:hover .open-ic, .strip .ins .pname.open .open-ic { color: var(--accent); }

    /* EQ viewer */
    .strip .eqsec .h { justify-content: flex-start; gap: 5px; align-items: center; }
    .strip .sec .h .eqname { text-transform: none; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
    .strip .eq .g { stroke: rgba(255,255,255,.07); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .strip .eq .z { stroke: rgba(255,255,255,.22); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .strip .eq .curve { fill: none; stroke: #7fc4ff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .strip .eq .fill { fill: rgba(127,196,255,.14); stroke: none; }
    .strip .eq.off .curve { stroke: #555; }
    .strip .eq .eqnote { font-size: 9px; color: #8a7a5a; margin-top: 2px; }

    .strip .ins[draggable="true"] .pname { cursor: grab; }
    .strip .ins.dragging { opacity: .4; }
    .strip .ins.dropto { box-shadow: 0 -2px 0 var(--accent); }

    /* Name and version */
    #about { flex: none; display: inline-flex; align-items: center; gap: 5px; padding-left: 10px; margin-left: 4px; border-left: 1px solid var(--line); color: var(--dim); font-size: 10.5px; white-space: nowrap; }
    #appname { color: #b9b9c2; font-weight: 600; }
    body.folded #about { display: none; }

    /* Folders: nesting bands and the fold button */
    .strip .nest { align-self: stretch; margin: 0 -2px -2px; display: flex; flex-direction: column; gap: 2px; padding-bottom: 2px; border-bottom: 1px solid #0f0f12; }
    .strip .nest i { display: block; height: 4px; opacity: .9; }
    .strip .nest i.start { margin-left: 4px; border-radius: 3px 0 0 0; }
    .strip .fold { position: absolute; right: 1px; bottom: -1px; z-index: 1; padding: 0 3px; height: 13px; font-size: 9px; line-height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--raised); color: var(--dim); cursor: pointer; }
    .strip .fold:hover { color: var(--text); border-color: #55555c; }
    .strip .fold.shut { color: var(--text); background: #33333a; }
    .strip.wide .fold { position: static; flex: none; height: 16px; line-height: 14px; font-size: 10px; }
    .strip.shut { box-shadow: inset -3px 0 0 #3a3a42; }
    /* Fader groups */
    .strip .grp { width: 100%; height: 12px; flex: none; padding: 0; margin: -2px 0 -1px; border: 1px dashed #5a5a64; border-radius: 3px; background: transparent; color: #111; font-size: 8.5px; font-weight: 800; line-height: 10px; cursor: pointer; }
    .strip .grp:not(.set)::after { content: '+'; color: #6a6a74; font-weight: 600; }
    .strip .grp:hover { border-color: var(--accent); border-style: solid; }
    .strip .grp:not(.set):hover::after { color: var(--accent); }
    .strip .grp.set:hover { box-shadow: 0 0 0 1px var(--accent); }
    .strip .grp.set { background: var(--g); border: 1px solid var(--g); }
    .strip.grouped .lane { box-shadow: inset 0 -2px 0 var(--g); }
    body.groups-off .strip .grp.set { opacity: .35; }
    body.groups-off .strip.grouped .lane { box-shadow: none; }
    #link.off { color: var(--dim); text-decoration: line-through; }
    .pop.groups { min-width: 130px; }
    .pop.groups .gitem { display: flex; align-items: center; gap: 7px; }
    .pop.groups .gitem i { width: 10px; height: 10px; border-radius: 3px; background: transparent; border: 1px solid #55555c; flex: none; }
    .pop.groups .gitem .gl { flex: 1; }
    .pop.groups .gitem .gn { color: var(--dim); font-size: 10px; }
    .pop.groups .gitem.cur { box-shadow: inset 2px 0 0 var(--accent); }

    /* Snapshots */
    .pop.snaps { width: 250px; }
    .pop .snapnew { display: flex; gap: 4px; margin: 6px; }
    .pop .snapnew .psearch { flex: 1; margin: 0; min-width: 0; }
    .pop .snapsave { padding: 0 9px; border-radius: 4px; border: 1px solid var(--sel); background: var(--sel); color: #fff; cursor: pointer; font-size: 11px; }
    .pop .snap { display: flex; gap: 2px; align-items: stretch; margin-bottom: 1px; }
    .pop .snap button { border: 0; background: transparent; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .pop .snapgo { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: baseline; padding: 4px 6px; text-align: left; }
    .pop .snapgo .pl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pop .snapgo .ps { color: var(--dim); font-size: 9.5px; flex: none; }
    .pop .snapgo:hover { background: var(--sel); color: #fff; }
    .pop .snapgo:hover .ps { color: rgba(255,255,255,.75); }
    .pop .snap.current .snapgo { box-shadow: inset 3px 0 0 var(--accent); }
    .pop .snapup, .pop .snapdel { width: 22px; color: var(--dim); }
    .pop .snapup:hover { background: var(--raised); color: var(--text); }
    .pop .snapdel:hover { background: var(--mute); color: #fff; }

    /* Adding plugins and sends */
    .strip .addrow { display: block; width: 100%; margin: 1px 0 3px; padding: 2px 4px; font-size: 10px; text-align: left; color: var(--dim); background: transparent; border: 1px dashed #3a3a42; border-radius: 3px; cursor: pointer; }
    .strip .addrow:hover { color: var(--text); border-color: #5a5a64; border-style: solid; background: var(--raised); }
    .pop { position: fixed; z-index: 50; background: #202025; border: 1px solid #3a3a42; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.55); font-size: 11px; color: var(--text); }
    .pop.menu { padding: 3px; min-width: 120px; display: flex; flex-direction: column; }
    .pop.menu button { text-align: left; padding: 4px 8px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; font-size: 11px; }
    .pop.menu button:hover, .pop.menu button:focus-visible { background: var(--sel); color: #fff; outline: none; }
    .pop.menu button.danger:hover, .pop.menu button.danger:focus-visible { background: var(--mute); }
    .pop.picker { width: 240px; display: flex; flex-direction: column; }
    .pop .psearch { margin: 6px; padding: 4px 7px; font: inherit; font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; outline: none; }
    .pop .psearch:focus { border-color: var(--sel); }
    .pop .plist { max-height: min(300px, calc(100vh - 80px)); overflow-y: auto; padding: 0 3px 4px; }
    .pop .pgroup { padding: 6px 6px 2px; font-size: 9.5px; color: var(--dim); position: sticky; top: 0; background: #202025; }
    .pop .pitem { display: flex; width: 100%; gap: 6px; align-items: baseline; padding: 3px 6px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; text-align: left; font-size: 11px; }
    .pop .pitem .pl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pop .pitem .ps { flex: none; color: var(--dim); font-size: 9.5px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pop .pitem.active { background: var(--sel); color: #fff; }
    .pop .pitem.active .ps { color: rgba(255,255,255,.75); }
    .pop .pnone { padding: 8px 10px; color: var(--dim); }

    /* Transport */
    header.transport { gap: 10px; padding: 5px 8px; background: #18181c; }
    .tgroup { display: flex; gap: 3px; }
    .tbtn { width: 30px; height: 26px; padding: 0; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 11px; line-height: 1; background: var(--raised); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; color: #cfcfd6; }
    .tbtn:hover { border-color: #4a4a52; color: #fff; }
    #play.on { background: #2f9e57; border-color: #2f9e57; color: #fff; }
    .tbtn { color: #e6e6ea; }
    .tbtn.wide { width: auto; padding: 0 9px; }
    #lunaMixer.on { background: var(--sel); border-color: var(--sel); color: #fff; }
    #lunaMixer[hidden] { display: none; }
    #rec { color: #e6e6ea; }
    #rec:hover { color: #ff6b6b; }
    #rec.on { background: #c33; border-color: #c33; color: #fff; }
    #rec.on.waiting { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { background: var(--raised); color: #ff6b6b; } }
    .ab { gap: 0; }
    .abbtn { width: 28px; font-weight: 800; font-size: 12px; }
    .abbtn.a { border-radius: 5px 0 0 5px; } .abbtn.b { border-radius: 0 5px 5px 0; border-left: 0; }
    .abbtn.a.on { background: #ffb547; border-color: #ffb547; color: #1a1d22; }
    .abbtn.b.on { background: #62c8f0; border-color: #62c8f0; color: #1a1d22; }
    .abbtn:disabled { color: #55555c; cursor: default; }
    .abbtn:disabled:hover { border-color: var(--line); }
    #loop.on { background: #2f6fd1; border-color: #2f6fd1; color: #fff; }
    .clock { display: flex; flex-direction: column; align-items: flex-start; min-width: 92px; padding: 1px 8px; background: #0d0d10; border: 1px solid var(--line); border-radius: 5px; font-variant-numeric: tabular-nums; }
    #barbeat { font: 600 16px/1.1 Menlo, ui-monospace, monospace; color: var(--accent); }
    #minsec { font: 10px/1.2 Menlo, ui-monospace, monospace; color: var(--dim); }
    .tinfo { display: flex; flex-direction: column; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; line-height: 1.3; }
    #tempo { color: var(--text); }

    /* Move buttons on wide strips */
    .strip .mv { flex: none; width: 16px; height: 16px; padding: 0; font-size: 9px; line-height: 1; border: 1px solid var(--line); border-radius: 3px; background: var(--raised); color: var(--dim); cursor: pointer; }
    .strip .mv:hover:not([disabled]) { color: #fff; border-color: #555; }
    .strip .mv[disabled] { opacity: .3; cursor: default; }
    .strip.moved { animation: moved .5s ease-out; }
    @keyframes moved { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: 0 0 0 2px transparent; } }

    /* Editable EQ */
    .strip .eq .eqarea { position: relative; height: 64px; background: #101013; border-radius: 3px; touch-action: none; }
    .strip .eq svg, .eqoverlay .eq svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: transparent; }
    .eq .g { stroke: rgba(255,255,255,.06); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .eq .g2 { stroke: rgba(255,255,255,.13); }
    .eq .nodes { position: absolute; inset: 0; pointer-events: none; }
    .eq .pt { position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px; border-radius: 50%; background: #7fc4ff; border: 1.5px solid #0e0e11; pointer-events: auto; cursor: grab; touch-action: none; }
    .eq .pt:hover, .eq .pt.drag { background: var(--accent); transform: scale(1.35); }
    .eq .pt.drag { cursor: grabbing; }
    .eq .pt.nogain { background: #9aa4b2; border-radius: 2px; }
    .eq .pt.hpf, .eq .pt.lpf { width: 8px; height: 8px; margin: -4px 0 0 -4px; }
    .strip .eqbig { margin-left: auto; width: 15px; height: 13px; padding: 0; font-size: 9px; line-height: 1; border: 1px solid var(--line); border-radius: 3px; background: var(--raised); color: var(--dim); cursor: pointer; }
    .strip .eqbig:hover { color: #fff; }
    .eqoverlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .eqpanel { width: min(720px, 92vw); background: #1c1c21; border: 1px solid #34343c; border-radius: 8px; padding: 10px 12px 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
    .eqtop { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .eqtop .t { font-weight: 600; font-size: 13px; }
    .eqtop .eqname { color: var(--dim); font-size: 11px; flex: 1; }
    .eqtop .x { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 13px; }
    .eqoverlay .eq .eqarea { position: relative; height: min(300px, 52vh); background: #0f0f12; border-radius: 5px; }
    .eqoverlay .eq .curve { stroke-width: 2; }
    .eqoverlay .eq .pt { width: 13px; height: 13px; margin: -7px 0 0 -7px; }
    .eqoverlay .bands { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11px; color: #c8c8d0; font-variant-numeric: tabular-nums; }
    .eqoverlay .hint { margin-top: 6px; font-size: 10px; color: var(--dim); }
    .eqoverlay .eqnote { font-size: 10px; color: #8a7a5a; margin-top: 4px; }
    .eq .curve { fill: none; stroke: #7fc4ff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .eq .fill { fill: rgba(127,196,255,.14); stroke: none; }
    .eq .z { stroke: rgba(255,255,255,.25); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .eq.off .curve { stroke: #555; }

    /* dB ruler: one scale at the left, lined up with every lane (they all share the same height). */
    #body { position: relative; }
    #ruler { flex: none; width: 30px; position: relative; background: var(--bg); border-right: 1px solid var(--line); }
    #ruler .rlane { position: absolute; left: 0; right: 0; }
    #ruler .rmark { position: absolute; right: 5px; font-size: 9px; line-height: 1; transform: translateY(-50%); color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #ruler .rmark::after { content: ''; position: absolute; right: -5px; top: 50%; width: 4px; border-top: 1px solid rgba(255,255,255,.3); }
    #ruler .rmark.zero { color: var(--text); font-weight: 600; }
    #ruler .rmark.minor { font-size: 0; }
    #ruler .rmark.minor::after { width: 2px; border-top-color: rgba(255,255,255,.18); }
    #ruler .hover { position: absolute; left: 1px; right: 1px; transform: translateY(-50%); font-size: 9px; line-height: 13px; text-align: center; border-radius: 3px; background: var(--accent); color: #111; font-weight: 600; display: none; z-index: 2; font-variant-numeric: tabular-nums; }
    #ruler .hover.on { display: block; }
    /* Hover line across the lane under the pointer. */
    .lane .hline { position: absolute; left: -2px; right: -2px; height: 0; border-top: 1px dashed rgba(242,193,78,.8); pointer-events: none; display: none; z-index: 1; }
    .lane:hover .hline { display: block; }
    .lane.dragging .hline { display: none; }

    /* Folded to a bar while LUNA's own Mixer shows: only the transport row stays. */
    body.folded header.tools, body.folded #body, body.folded .tinfo, body.folded #status { display: none; }
    body.folded header.transport { border-bottom: 0; }
    .eq .pt { pointer-events: none; cursor: default; width: 7px; height: 7px; margin: -4px 0 0 -4px; }
    .eqoverlay .eq .pt { width: 9px; height: 9px; margin: -5px 0 0 -5px; }

    .strip .ins .pname .place { flex: none; font-size: 8px; text-transform: uppercase; letter-spacing: .04em; color: #111; background: #8fa3bf; border-radius: 2px; padding: 0 3px; }
    .strip .ins.place-console .pname { background: #2a303b; }

    #ruler .rhead { position: absolute; left: 0; right: 0; text-align: center; font-size: 8px; line-height: 1.15; font-weight: 700; letter-spacing: .04em; color: #7fc4ff; }
    #ruler .rmark { color: #9fb6cc; }
    #ruler .rmark.zero { color: #cfe6ff; }
  
    /* Grey theme: the same layout with lighter greys in place of the near-black backgrounds. */
    #theme { display: inline-flex; align-items: center; }

    /* Strip tint: the channel's colour over the strip, at the strength chosen under ◐ */
    .strip { position: relative; isolation: isolate; }
    .strip::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--c, transparent); opacity: var(--tint, 0); pointer-events: none; border-radius: inherit; }
    .strip .color { cursor: pointer; position: relative; }
    .strip .color::after { content: ''; position: absolute; left: 0; right: 0; top: -2px; bottom: -4px; }
    .strip .color:hover { box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
    .strip.master .color { cursor: default; }
    .pop .chead { padding: 4px 6px 3px; font-size: 9.5px; color: var(--dim); display: flex; justify-content: space-between; }
    .pop.colors { padding: 4px; }
    .pop .cgrid { display: grid; grid-template-columns: repeat(6, 22px); gap: 4px; padding: 2px 4px 4px; }
    .pop .csw { width: 22px; height: 22px; padding: 0; border-radius: 5px; border: 1px solid rgba(0,0,0,.35); cursor: pointer; }
    .pop .csw:hover, .pop .csw:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
    .pop .csw.cur { box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(0,0,0,.5); }
    .pop.look { padding: 6px; width: 200px; }
    .pop .seg { display: flex; gap: 3px; padding: 0 4px 6px; }
    .pop .seg button { flex: 1; padding: 4px 0; border-radius: 4px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-size: 11px; }
    .pop .seg button.on { background: var(--sel); border-color: var(--sel); color: #fff; }
    .pop .tint { width: calc(100% - 8px); margin: 2px 4px; accent-color: var(--accent); }
    .pop .thint { padding: 2px 6px 2px; font-size: 9.5px; color: var(--dim); }
    body.grey { --bg: #3b3e45; --panel: #474a52; --raised: #555962; --line: #60646e; --text: #f1f1f4; --dim: #b4b7bf; }
    body.grey header.transport { background: #404349; }
    body.grey #ruler { background: #3b3e45; }
    body.grey .clock { background: #2b2d32; }
    body.grey .lane { background: #2a2c31; }
    body.grey .lane .stream { background: #33363c; }
    body.grey .strip .peak { background: #2f3136; }
    body.grey .strip.wide { background: #50545c; }
    body.grey .strip .ins .pname { background: #5c606a; }
    body.grey .strip .ins.place-console .pname { background: #5a6273; }
    body.grey .strip .send { background: #3e4148; }
    body.grey .strip .eq .eqarea { background: #2f3136; }
    body.grey .pop, body.grey .pop .pgroup { background: #4a4d55; }
    body.grey .pop { border-color: #686c76; }
    body.grey .eqpanel { background: #44474f; border-color: #60646e; }
    body.grey .eqoverlay .eq .eqarea { background: #2f3136; }
    body.grey .strip .none { color: #9a9da6; }
    body.grey .lane .tick { border-top-color: rgba(255,255,255,.2); }
    body.grey .strip .addrow { border-color: #6a6e78; }
    body.grey .strip .grp:not(.set) { border-color: #777b85; }
    body.grey .strip .grp:not(.set)::after { color: #8c909a; }

    /* ==== 1.2 look: in line with the newer add-ons ==================================== */
    :root {
      --bg: #141619; --panel: #1d2024; --raised: #24282d; --line: #2c3036; --text: #f1f0ec; --dim: #858a93;
      --well: #101215; --silk: #b9bdc5; --mute: #ff5a6a; --solo: #ffd23f;
      --accent: var(--acc); --sel: var(--acc);
    }
    body[data-color="yellow"] { --acc: #ffd23f; --acc2: #f5a623; --ink: #1f1600; }
    body[data-color="orange"] { --acc: #ffa94d; --acc2: #ff6b3d; --ink: #1f0c00; }
    body[data-color="red"]    { --acc: #ff6b6b; --acc2: #e0334f; --ink: #1f0508; }
    body[data-color="green"]  { --acc: #2ee6a6; --acc2: #9be14a; --ink: #0b1a10; }
    body[data-color="blue"]   { --acc: #4cc3ff; --acc2: #5b6cff; --ink: #06131f; }
    body[data-color="pink"]   { --acc: #ff86c8; --acc2: #ff4f8b; --ink: #1f0612; }
    body[data-color="purple"] { --acc: #c08bff; --acc2: #7b5cff; --ink: #12081f; }
    body.grey { --bg: #4a4e55; --panel: #555a62; --raised: #5d626a; --line: #6a6f78; --well: #41454b; --text: #f6f5f1; --dim: #c9ccd1; --silk: #e1e3e6; }
    body.grey[data-color="yellow"] { --acc: #ffdc66; --acc2: #ffb648; }
    body.grey[data-color="orange"] { --acc: #ffbd73; --acc2: #ff8a63; }
    body.grey[data-color="red"]    { --acc: #ff8f8f; --acc2: #ff5c74; }
    body.grey[data-color="green"]  { --acc: #5ff0bd; --acc2: #b8ee7a; }
    body.grey[data-color="blue"]   { --acc: #7fd4ff; --acc2: #8f9bff; }
    body.grey[data-color="pink"]   { --acc: #ffa6d6; --acc2: #ff79a8; }
    body.grey[data-color="purple"] { --acc: #d4adff; --acc2: #a08bff; }
    body { font: 12px/1.3 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }

    /* Bars */
    header, header.transport, body.grey header.transport { background: var(--bg); border-bottom: 1px solid var(--line); }
    header.transport { padding: 8px 10px; gap: 10px; }
    header.tools { padding: 6px 10px; gap: 6px; }
    .btn { background: var(--well); border: 1px solid var(--line); border-radius: 9px; padding: 4px 10px; font-weight: 700; color: var(--silk); }
    .btn:hover { border-color: var(--silk); color: var(--text); }
    .btn.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color: transparent; color: var(--ink); }
    #search { background: var(--well); border-radius: 9px; padding: 4px 9px; }
    #kinds { background: var(--well); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
    .chip { border: 0; border-radius: 7px; padding: 2px 9px; font-weight: 700; color: var(--dim); }
    .chip:hover { color: var(--text); }
    .chip.on { background: var(--raised); color: var(--text); }
    .dot { width: 14px; height: 14px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    .dot.on { border-color: var(--text); }
    #clearSolo.active { background: linear-gradient(135deg, #ffd23f, #f5a623); border-color: transparent; color: #1f1600; }
    #unmute.active { background: linear-gradient(135deg, #ff6b6b, #e0334f); border-color: transparent; color: #fff; }
    #count { font-weight: 700; }
    #appname { color: var(--text); font-weight: 800; font-size: 12.5px; }
    #about { border-left-color: var(--line); }

    /* Transport */
    .tgroup { background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
    .tbtn, .tbtn:hover { border: 0; background: none; border-radius: 8px; color: var(--silk); height: 26px; }
    .tbtn:hover { background: var(--raised); color: var(--text); }
    #lunaMixer { background: var(--well); border: 1px solid var(--line); border-radius: 10px; height: 32px; font-weight: 700; }
    #lunaMixer:hover { border-color: var(--silk); }
    #lunaMixer.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color: transparent; color: var(--ink); }
    #play.on { background: linear-gradient(135deg, #3ddc84, #2bb673); color: #062312; }
    #rec.on { background: linear-gradient(135deg, #ff6b6b, #e0334f); color: #fff; }
    #loop.on { background: linear-gradient(135deg, #4cc3ff, #5b6cff); color: #06131f; }
    @keyframes blink { to { background: transparent; color: #ff6b6b; } }
    .ab { padding: 2px; }
    .abbtn.a, .abbtn.b { border-radius: 8px; border: 0; }
    .abbtn.a.on { background: linear-gradient(135deg, #ffc061, #ff9b3d); color: #1f1000; }
    .abbtn.b.on { background: linear-gradient(135deg, #6fd6ff, #4c9dff); color: #06131f; }
    .abbtn:disabled { color: var(--dim); opacity: .5; }
    .clock, body.grey .clock { background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: 2px 10px; }
    #barbeat { font: 800 16px/1.15 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-variant-numeric: tabular-nums; background: linear-gradient(90deg, var(--acc), var(--acc2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #minsec { font: 600 10px/1.2 ui-rounded, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .tinfo { font-weight: 700; }

    /* Strips */
    #strips { gap: 2px; padding: 6px; }
    #masterBox { background: var(--bg); padding: 6px; border-left-color: var(--line); }
    .strip { background: var(--panel); border-radius: 9px; padding: 0 2px 4px; gap: 4px; border: 1px solid transparent; }
    .strip.selected { border-color: color-mix(in srgb, var(--acc) 70%, transparent); }
    .strip .color { height: 4px; margin: 0 -2px; }
    .strip .name { font-size: 10px; font-weight: 700; line-height: 1.25; }
    .strip .peak, body.grey .strip .peak { background: var(--well); border-radius: 5px; font-weight: 700; }
    .strip .peak.hot { background: linear-gradient(135deg, #ff6b6b, #e0334f); }
    .lane, body.grey .lane { background: var(--well); border-radius: 6px; }
    .lane .bars { border-radius: 6px; padding: 0 2px; }
    .lane .stream, body.grey .lane .stream { background: color-mix(in srgb, var(--panel) 70%, var(--well)); border-radius: 2px; }
    .lane .cap::before { left: -3px; right: -3px; height: 4px; top: -2px; border-radius: 3px; background: var(--text); box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 1px 4px rgba(0,0,0,.5); }
    .lane:hover .cap::before, .lane.dragging .cap::before { height: 5px; top: -2.5px; background: linear-gradient(90deg, var(--acc), var(--acc2)); }
    .lane .hline { border-top-color: color-mix(in srgb, var(--acc) 80%, transparent); }
    .strip .db { font-weight: 700; }
    .strip .buttons { gap: 3px; }
    .strip .buttons button { border-radius: 6px; border: 1px solid var(--line); background: var(--well); color: var(--silk); font-weight: 800; padding: 2px 0; }
    .strip .buttons button:hover { color: var(--text); border-color: var(--silk); }
    .strip .mute.on { background: linear-gradient(135deg, #ff6b6b, #e0334f); border-color: transparent; color: #fff; }
    .strip .solo.on { background: linear-gradient(135deg, #ffd23f, #f5a623); border-color: transparent; color: #1f1600; }
    .strip .grp { border-radius: 5px; border-color: var(--line); }
    .strip .grp:hover { border-color: var(--acc); }
    .strip.pinned { border-color: color-mix(in srgb, var(--acc) 40%, transparent); }

    /* Wide strip */
    .strip.wide, body.grey .strip.wide { background: var(--raised); border-color: color-mix(in srgb, var(--acc) 70%, transparent); border-radius: 12px; }
    .strip.wide .name { font-size: 12px; font-weight: 800; }
    .strip .sec .h { font-size: 10px; text-transform: none; letter-spacing: 0; font-weight: 800; color: var(--dim); }
    .strip .none, body.grey .strip .none { color: var(--dim); opacity: .7; }
    .strip .ins .pname, body.grey .strip .ins .pname { background: var(--well); border-color: var(--line); border-radius: 6px; font-weight: 700; padding: 3px 6px; }
    .strip .ins .pname:hover { border-color: var(--silk); }
    .strip .ins .pname.open { border-color: var(--acc); color: var(--acc); }
    .strip .ins .pwr { border-radius: 6px; background: var(--well); border-color: var(--line); width: 16px; }
    .strip .ins .pwr::after { left: 5px; }
    .strip .ins .pwr.on::after { background: #3ddc84; box-shadow: 0 0 5px #3ddc84; }
    .strip .send, body.grey .strip .send { background: var(--well); border-radius: 7px; padding: 3px 5px; }
    .strip .send input, .strip .pan { accent-color: var(--acc); }
    .strip .send button { border-radius: 4px; background: var(--raised); }
    .strip .send .smute.on { background: #e0334f; border-color: transparent; }
    .strip .send .spre.on { background: #4c9dff; border-color: transparent; }
    .strip .addrow, body.grey .strip .addrow { border-radius: 7px; border-color: var(--line); font-weight: 700; padding: 3px 6px; }
    .strip .addrow:hover { border-color: var(--acc); color: var(--acc); background: transparent; }
    .strip .mv, .strip .eqbig, .strip .fold, .strip .pin { border-radius: 5px; }
    .strip .eq .eqarea, body.grey .strip .eq .eqarea { background: var(--well); border-radius: 7px; }
    .eq .curve { stroke: var(--acc); }
    .eq .fill { fill: color-mix(in srgb, var(--acc) 16%, transparent); }
    .eq .pt { background: var(--acc); }

    /* dB ruler */
    #ruler, body.grey #ruler { background: var(--bg); border-right-color: var(--line); }
    #ruler .rhead { color: var(--acc); }
    #ruler .rmark { color: var(--dim); font-weight: 600; }
    #ruler .rmark.zero { color: var(--text); font-weight: 800; }
    #ruler .hover { background: linear-gradient(90deg, var(--acc), var(--acc2)); color: var(--ink); }

    /* Pop-ups */
    .pop, body.grey .pop { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); font-size: 11.5px; }
    .pop .pgroup, body.grey .pop .pgroup { background: var(--raised); font-weight: 800; }
    .pop.menu { padding: 5px; }
    .pop.menu button, .pop .pitem, .pop .snapgo { border-radius: 7px; font-weight: 600; }
    .pop.menu button:hover, .pop.menu button:focus-visible, .pop .pitem.active, .pop .snapgo:hover { background: color-mix(in srgb, var(--acc) 30%, transparent); color: var(--text); }
    .pop .pitem.active .ps, .pop .snapgo:hover .ps { color: var(--silk); }
    .pop .psearch { background: var(--well); border-radius: 8px; padding: 5px 9px; }
    .pop .psearch:focus { border-color: var(--acc); }
    .pop .snapsave { background: linear-gradient(135deg, var(--acc), var(--acc2)); border: 0; color: var(--ink); font-weight: 800; border-radius: 8px; }
    .pop .chead { font-weight: 800; font-size: 10.5px; }
    .pop .seg { background: var(--well); border: 1px solid var(--line); border-radius: 9px; padding: 2px; margin: 0 4px 8px; gap: 2px; }
    .pop .seg button { border: 0; background: none; border-radius: 7px; font-weight: 700; color: var(--dim); }
    .pop .seg button.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--ink); }
    .pop .tint { accent-color: var(--acc); }
    .pop.look { width: 220px; }
    .pop .accs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 2px 4px 8px; }
    .pop .accs button { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid transparent; cursor: pointer; background-clip: padding-box; }
    .pop .accs button.on { border-color: var(--text); }
    .pop .accs button:hover { transform: scale(1.1); }
    .eqpanel, body.grey .eqpanel { background: var(--panel); border-color: var(--line); border-radius: 14px; }
    .eqoverlay .eq .eqarea, body.grey .eqoverlay .eq .eqarea { background: var(--well); border-radius: 9px; }
  </style>
</head>

  <header class="transport">
    <div class="tgroup">
      <button id="rtz" class="tbtn" title="Return to zero"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2.5" y="3" width="2" height="10" rx=".5" fill="currentColor"/><path d="M13.5 3.2v9.6L5.6 8z" fill="currentColor"/></svg></button>
      <button id="barBack" class="tbtn" title="Back one bar"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.5v9L1.5 8zM14.5 3.5v9L8 8z" fill="currentColor"/></svg></button>
      <button id="barFwd" class="tbtn" title="Forward one bar"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.5v9L14.5 8zM1.5 3.5v9L8 8z" fill="currentColor"/></svg></button>
      <button id="stop" class="tbtn" title="Stop"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="currentColor"/></svg></button>
      <button id="play" class="tbtn" title="Play (Space)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4.5 2.8v10.4L13.2 8z" fill="currentColor"/></svg></button>
      <button id="rec" class="tbtn" title="Record"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="4.6" fill="currentColor"/></svg></button>
      <button id="loop" class="tbtn" title="Loop"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8a4 4 0 0 1 4-4h4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M10.5 1.8 13 4l-2.5 2.2z" fill="currentColor"/><path d="M13 8a4 4 0 0 1-4 4H4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5.5 14.2 3 12l2.5-2.2z" fill="currentColor"/></svg></button>
    </div>
    <button id="lunaMixer" class="tbtn wide" title="Show LUNA's own Mixer in the main window (click again for the Timeline)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2v12M8 2v12M12 2v12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".55"/><rect x="2.3" y="8.5" width="3.4" height="2.4" rx=".6" fill="currentColor"/><rect x="6.3" y="4.2" width="3.4" height="2.4" rx=".6" fill="currentColor"/><rect x="10.3" y="10" width="3.4" height="2.4" rx=".6" fill="currentColor"/></svg><span>LUNA Mixer</span></button>
    <div class="tgroup ab" id="ab">
      <button id="abA" class="tbtn abbtn a" disabled>A</button><button id="abB" class="tbtn abbtn b" disabled>B</button>
    </div>
    <div class="clock"><div id="barbeat">1|1|000</div><div id="minsec">00:00.0</div></div>
    <div class="tinfo"><span id="tempo">— BPM</span><span id="sig">-/-</span></div>
    <div class="spacer"></div>
    <span id="status">connecting…</span>
    <span id="about"><span id="appname">Compact Mixer</span> <span id="appver"></span></span>
  </header>
  <header class="tools">
    <input id="search" type="search" placeholder="Filter: vox, gtr…" spellcheck="false" autocomplete="off">
    <div class="group" id="kinds"></div>
    <div class="group" id="colors"></div>
    <button id="reset" class="btn" title="Show every channel">Show all</button>
    <span id="count"></span>
    <div class="spacer"></div>
    <button id="snaps" class="btn" title="Mix snapshots: save the mix under a name and recall it with a click">Snapshots</button>
    <button id="link" class="btn" title="Fader groups">Groups</button>
    <button id="clearSolo" class="btn" title="Clear every solo (one undo step)">S 0</button>
    <button id="unmute" class="btn" title="Unmute every channel (one undo step)">M 0</button>
    <button id="density" class="btn" title="Strip width">⇔</button>
    <button id="theme" class="btn" title="Theme"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/></svg></button>
  </header>
  <div id="body">
    <div id="ruler" title="Audio level scale of the meters, in dBFS (not the fader position: the fader value is the number under each lane)"><div class="rlane"></div></div>
    <div id="strips"></div>
    <div id="masterBox"></div>
  </div>
  <script src="vendor/luna.global.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
